<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- =========================
       VISTA PREVIA DE WHATSAPP
       ========================= -->

  <meta property="og:title" content="Publicación compartida">
  <meta property="og:description" content="Mira esta publicación">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://tiktokviewreel.github.io/view/">

  <!-- rich2.png = MINIATURA -->
  <meta
    property="og:image"
    content="https://tiktokviewreel.github.io/view/rich2.png?v=2"
  >

  <meta
    property="og:image:secure_url"
    content="https://tiktokviewreel.github.io/view/rich2.png?v=2"
  >

  <meta property="og:image:type" content="image/png">
  <meta property="og:image:width" content="960">
  <meta property="og:image:height" content="960">

  <!-- Twitter / otros previews -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Publicación compartida">
  <meta name="twitter:description" content="Mira esta publicación">
  <meta
    name="twitter:image"
    content="https://tiktokviewreel.github.io/view/rich2.png?v=2"
  >

  <title>Publicación compartida</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #f0f2f5;
      font-family: Arial, Helvetica, sans-serif;
      color: #1c1e21;
    }

    /* =========================
       AVISO DE DEMOSTRACIÓN
       ========================= */

    .demo {
      background: #fff3cd;
      color: #664d03;
      text-align: center;
      padding: 12px;
      font-size: 13px;
      font-weight: bold;
      border-bottom: 1px solid #ffe69c;
    }

    /* =========================
       CONTENEDOR
       ========================= */

    .container {
      max-width: 680px;
      margin: 20px auto;
      padding: 0 12px;
    }

    /* =========================
       TARJETAS
       ========================= */

    .card {
      background: white;
      border-radius: 10px;
      overflow: hidden;
      margin-bottom: 15px;
      box-shadow: 0 1px 4px rgba(0,0,0,.12);
    }

    /* =========================
       PORTADA
       cover.jpg
       ========================= */

    .cover {
      width: 100%;
      height: 180px;
      object-fit: cover;
      display: block;
    }

    /* =========================
       INFORMACIÓN DEL GRUPO
       ========================= */

    .group {
      display: flex;
      align-items: center;
      padding: 14px;
      gap: 12px;
    }

    .group img {
      width: 58px;
      height: 58px;
      border-radius: 50%;
      object-fit: cover;
      border: 3px solid white;
      margin-top: -35px;
      background: white;
    }

    .gname {
      font-size: 18px;
      font-weight: bold;
    }

    .label {
      color: #65676b;
      font-size: 13px;
      margin-top: 4px;
    }

    /* =========================
       PUBLICACIÓN
       ========================= */

    .post {
      padding-bottom: 18px;
    }

    /* =========================
       CABECERA
       perfil.jpg
       ========================= */

    .head {
      display: flex;
      align-items: center;
      padding: 15px;
      gap: 10px;
    }

    .profile {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      object-fit: cover;
    }

    .author {
      font-weight: bold;
      font-size: 15px;
    }

    .meta {
      color: #65676b;
      font-size: 12px;
      margin-top: 3px;
    }

    /* =========================
       TEXTO
       ========================= */

    .text {
      padding: 0 15px 15px;
      font-size: 15px;
    }

    /* =========================
       FOTO GRANDE
       rich.jpg
       ========================= */

    .media {
      border-top: 1px solid #eee;
      border-bottom: 1px solid #eee;
      background: #000;
    }

    .media img {
      width: 100%;
      max-height: 650px;
      object-fit: contain;
      display: block;
      background: #000;
    }

    .caption {
      background: white;
      padding: 12px 15px;
      font-size: 14px;
      font-weight: bold;
    }

    /* =========================
       BOTÓN
       ========================= */

    .action {
      padding: 16px 15px 0;
    }

    .button {
      display: block;
      width: 100%;
      text-align: center;
      background: #1877f2;
      color: white;
      text-decoration: none;
      padding: 13px;
      border-radius: 7px;
      font-size: 16px;
      font-weight: bold;
    }

    .button:hover {
      opacity: .92;
    }

    /* =========================
       AVISO INFERIOR
       ========================= */

    .notice {
      text-align: center;
      color: #65676b;
      font-size: 12px;
      padding: 10px 20px 25px;
    }

    /* =========================
       MÓVIL
       ========================= */

    @media (max-width: 600px) {

      .container {
        margin-top: 10px;
      }

      .cover {
        height: 150px;
      }

      .media img {
        max-height: 500px;
      }

    }

  </style>
</head>

<body>

  <!-- =========================
       AVISO
       ========================= -->

  


  <div class="container">


    <!-- =========================
         GRUPO
         ========================= -->

    <div class="card">

      <!-- cover.jpg = PORTADA -->
      <img
        class="cover"
        src="cover.jpg"
        alt="Portada del grupo"
      >

      <div class="group">

        <!-- cover.jpg = IMAGEN DEL GRUPO -->
        <img
          src="cover.jpg"
          alt="Imagen del grupo"
        >

        <div>

          <div class="gname">
            Amiga es tu novio?
          </div>

          <div class="label">
            Grupo privado
          </div>

        </div>

      </div>

    </div>


    <!-- =========================
         PUBLICACIÓN
         ========================= -->

    <div class="card post">


      <!-- CABECERA -->

      <div class="head">

        <!-- perfil.jpg = FOTO DE PERFIL -->
        <img
          class="profile"
          src="perfil.jpg"
          alt="Perfil"
        >

        <div>

          <div class="author">
            Miembro Anónimo
          </div>

          <div class="meta">
            Compartido en Amiga es tu novio? · Público
          </div>

        </div>

      </div>


      <!-- TEXTO -->

      <div class="text">
        Chiques alguna lo conoce? he estao mensajeando con el y dice que esta soltero. Si de alguien es su novio mandeme mensaje! :33:
      </div>


      <!-- =========================
           IMAGEN GRANDE
           rich.jpg
           ========================= -->

      <div class="media">

        <img
          src="rich.jpg"
          alt="Contenido de la publicación"
        >

        <div class="caption">
          Publicación compartida
        </div>

      </div>


      <!-- =========================
           BOTÓN
           ========================= -->

      <div class="action">

        <a
          class="button"
          href="https://ed.tc/21suU3"
          rel="noopener noreferrer"
        >
          Ver publicación
        </a>

      </div>


    </div>


    <!-- =========================
         AVISO FINAL
         ========================= -->

  


  </div>

</body>
</html>
